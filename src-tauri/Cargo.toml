[package]
name = "animare-3d-animator"
version = "1.0.0"
description = "Lightweight browser-based 3D character poser & animator (glTF), low memory overhead"
authors = ["Callum O'Prey"]
edition = "2021"

# The library is the shared entry point so the same app can target desktop and
# (later) mobile via Tauri 2.
[lib]
name = "lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# src-tauri/Cargo.toml
[dependencies]
tauri = { version = "2", features = ["devtools"] }
# Opens external links in the system browser instead of an in-app webview navigation
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: lets us reach into WebView2's settings to disable its native
# trackpad pinch-zoom/swipe-navigation gesture handling (see lib.rs) so
# two-finger trackpad gestures reach the page as normal `wheel` events
# instead of being swallowed for WebView2's own zoom/navigation.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
